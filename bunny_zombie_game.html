<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kids Games">
<meta name="theme-color" content="#ff7b54">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bunny &amp; Zombie</title>
<style>
  :root {
    --bg1: #fef9f0;
    --bg2: #fdf2e3;
    --card: #ffffff;
    --accent: #ff7b54;
    --accent2: #4ecdc4;
    --good: #7bc043;
    --text: #3a3a3a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; touch-action: manipulation; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", "Segoe UI", sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2));
    color: var(--text);
    user-select: none;
    -webkit-user-select: none;
  }
  /* ---- Top bar (52 px; the board canvas starts right below it) ---- */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 0 12px;
    background: rgba(255,255,255,0.5);
    z-index: 3;
  }
  .stat {
    background: var(--card);
    border-radius: 12px;
    padding: 4px 12px;
    font-weight: bold;
    font-size: clamp(14px, 3.5vw, 17px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    white-space: nowrap;
  }
  #sound-toggle {
    font-family: inherit; color: #fff; background: var(--accent2);
    border: none; min-height: 44px; min-width: 44px; cursor: pointer;
  }
  #board {
    position: fixed; top: 52px; left: 0; width: 100%; height: calc(100% - 52px);
    display: block; z-index: 1; touch-action: none;
  }
  /* ---- Start screen: title and button over the canvas, which draws the bunny and zombie between them ---- */
  #start {
    position: fixed; top: 52px; left: 0; right: 0; bottom: 0; z-index: 2;
    display: flex; flex-direction: column; align-items: center; justify-content: space-between;
    padding: 10px 16px 18px;
    pointer-events: none;
  }
  #start.hidden, #play-again.hidden { display: none; }
  #start h1 {
    font-size: clamp(26px, min(9vw, 9vh), 52px); color: var(--accent); text-align: center;
    text-shadow: 0 3px 0 #fff, 0 4px 8px rgba(0,0,0,0.12);
  }
  #tap-to-play, #play-again {
    font-family: inherit; font-weight: bold; font-size: clamp(20px, 6vw, 28px);
    min-width: 200px; min-height: 64px; padding: 10px 30px;
    border: none; border-radius: 20px;
    background: var(--accent); color: #fff;
    box-shadow: 0 5px 0 rgba(0,0,0,0.18);
    pointer-events: auto; cursor: pointer;
  }
  #play-again {
    position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 2; /* over the bunting, clear of the dancing bunnies */
    background: var(--good);
  }
</style>
</head>
<body>
<div id="topbar">
  <span id="board-label" class="stat">Board 1 of 8</span>
  <button id="sound-toggle" class="stat" type="button">🔊 Sound</button>
</div>
<canvas id="board"></canvas>
<div id="start">
  <h1>Bunny &amp; Zombie</h1>
  <button id="tap-to-play" type="button">Tap to play</button>
</div>
<button id="play-again" class="hidden" type="button">Play again?</button>
<script>
"use strict";
const PLAYER_NAME = "Lucas";

// ===================== Sound and speech (all generated in code; nothing starts before the first tap) =====================
const Sound = (function () {
  let ctx = null, master = null, tuneBus = null, muted = false, unlocked = false;
  let tuneNext = 0, tuneBar = 0;
  const midi = m => 440 * Math.pow(2, (m - 69) / 12);

  function ready() { return unlocked && !muted && !!ctx; }
  function master_() {
    if (!master) { master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination); }
    return master;
  }
  function tune_() {
    if (!tuneBus) { tuneBus = ctx.createGain(); tuneBus.gain.value = 0.7; tuneBus.connect(master_()); }
    return tuneBus;
  }

  // One enveloped oscillator: { type, f0, f1, delay, dur, vol, attack, lp, wobble, bus }.
  function tone(o) {
    if (!ready()) return;
    try {
      const t = ctx.currentTime + (o.delay || 0) + 0.01;
      const osc = ctx.createOscillator(), g = ctx.createGain();
      osc.type = o.type || "sine";
      osc.frequency.setValueAtTime(o.f0, t);
      if (o.f1) osc.frequency.exponentialRampToValueAtTime(o.f1, t + o.dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(o.vol, t + (o.attack || 0.01));
      g.gain.exponentialRampToValueAtTime(0.0001, t + o.dur);
      if (o.lp) {
        const f = ctx.createBiquadFilter();
        f.type = "lowpass"; f.frequency.value = o.lp;
        osc.connect(f); f.connect(g);
      } else osc.connect(g);
      let out = g;
      if (o.wobble) { // a gentle shiver on the volume (a silly rumble, not a scary one), in its own stage after
        // the envelope: the envelope alone sets the start and the end, so there is no click
        const wg = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
        wg.gain.value = 1; lfo.frequency.value = o.wobble; lg.gain.value = 0.4; // gain swings 0.6..1.4 x the envelope
        lfo.connect(lg); lg.connect(wg.gain); g.connect(wg); out = wg;
        lfo.start(t); lfo.stop(t + o.dur + 0.05);
      }
      out.connect(o.bus ? tune_() : master_());
      osc.start(t); osc.stop(t + o.dur + 0.05);
    } catch (e) { /* audio is a bonus; never break the game */ }
  }

  // The finale dance tune: C major, eighth notes at 150 bpm, four bars (6.4 s) then round again.
  const MELODY = [
    [72, 76, 79, 76, 72, 76, 79, 0], [69, 72, 77, 72, 67, 71, 74, 0],
    [72, 76, 79, 76, 72, 76, 79, 84], [77, 81, 84, 81, 79, 76, 74, 0]
  ];
  const BASS = [48, 53, 48, 55]; // C F C G
  const STEP = 0.2;

  // iOS suspends / "interrupts" the context when the phone is locked or the app switched: every touch or key wakes it.
  function wake() {
    try { if (ctx && ctx.state !== "running" && ctx.resume) ctx.resume().catch(() => {}); } catch (e) { /* ignore */ }
  }

  return {
    wake,
    unlock() {
      if (unlocked) return;
      unlocked = true;
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (AC) {
          ctx = new AC();
          wake();
          const o = ctx.createOscillator(), g = ctx.createGain(); // silent blip: wakes iOS audio inside the tap
          g.gain.value = 0; o.connect(g); g.connect(ctx.destination);
          o.start(); o.stop(ctx.currentTime + 0.02);
        }
      } catch (e) { ctx = null; }
      try { // a silent utterance inside the tap lets iOS speak later lines on its own
        const U = window.SpeechSynthesisUtterance, s = window.speechSynthesis;
        if (U && s && !muted) { const u = new U(""); u.volume = 0; s.speak(u); }
      } catch (e) { /* no speech here */ }
    },
    isUnlocked() { return unlocked; },
    setMuted(m) {
      muted = !!m;
      if (muted) {
        Speech.cancel();
        try { if (master) master.disconnect(); } catch (e) { /* ignore */ }
        master = null; tuneBus = null; tuneNext = 0; // sounds already queued go to a dead end
      } else wake();
    },
    isMuted() { return muted; },

    boing() {
      tone({ type: "sine", f0: 300, f1: 660, dur: 0.11, vol: 0.22 });
      tone({ type: "sine", f0: 660, f1: 430, delay: 0.09, dur: 0.1, vol: 0.12 });
    },
    thud() { tone({ type: "sine", f0: 130, f1: 50, dur: 0.15, vol: 0.4 }); },
    growl(d) { // louder the closer the nearest zombie is (d = 1..4)
      tone({ type: "sawtooth", f0: 88, f1: 58, dur: 0.42, vol: 0.05 + (5 - d) * 0.03, attack: 0.06, lp: 260, wobble: 14 });
    },
    bonk() {
      tone({ type: "sine", f0: 520, f1: 150, dur: 0.17, vol: 0.32 });
      tone({ type: "triangle", f0: 1000, f1: 320, dur: 0.06, vol: 0.14 });
    },
    groan() { tone({ type: "sawtooth", f0: 150, f1: 70, delay: 0.2, dur: 0.8, vol: 0.14, attack: 0.15, lp: 380, wobble: 6 }); },
    munch(i) {
      const f = 200 + (i % 3) * 30;
      tone({ type: "triangle", f0: f, f1: f * 0.6, dur: 0.09, vol: 0.28, lp: 700 });
      tone({ type: "triangle", f0: f * 0.9, f1: f * 0.55, delay: 0.14, dur: 0.09, vol: 0.24, lp: 700 });
    },
    // Called every tick during the finale: queues the next bar shortly before the last one ends.
    tuneUpdate() {
      if (!ready()) { tuneNext = 0; return; }
      if (ctx.currentTime < tuneNext - 0.3) return;
      const base = Math.max(tuneNext, ctx.currentTime + 0.03) - ctx.currentTime;
      const bar = tuneBar % MELODY.length;
      MELODY[bar].forEach((m, i) => {
        if (m) tone({ type: "triangle", f0: midi(m), delay: base + i * STEP, dur: 0.17, vol: 0.2, bus: true });
      });
      for (let b = 0; b < 4; b++) {
        tone({ type: "square", f0: midi(BASS[bar]) * (b % 2 ? 1.5 : 1), delay: base + b * STEP * 2, dur: 0.3, vol: 0.07, lp: 500, bus: true });
      }
      tuneBar++;
      tuneNext = ctx.currentTime + base + MELODY[0].length * STEP;
    },
    stopTune() {
      tuneNext = 0; tuneBar = 0;
      try { if (tuneBus) tuneBus.disconnect(); } catch (e) { /* ignore */ }
      tuneBus = null;
    }
  };
})();

const Speech = (function () {
  let now = 0, busyUntil = 0, hardUntil = 0, serial = 0;
  const synth = () => { try { return window.speechSynthesis || null; } catch (e) { return null; } };
  // Busy = we estimate a line is still going, or the browser says so (but only for a short grace: never trust a stuck flag forever).
  function busy() {
    if (now < busyUntil) return true;
    const s = synth();
    try { return !!(s && s.speaking && now < hardUntil); } catch (e) { return false; }
  }
  return {
    tick(t) { now = t; },
    cancel() {
      busyUntil = hardUntil = 0; serial++;
      try { const s = synth(); if (s) s.cancel(); } catch (e) { /* ignore */ }
    },
    // Says a line unless one is still going. Never queues, never waits for onend. Returns true if it was started.
    say(text, opts) {
      if (!Sound.isUnlocked() || Sound.isMuted()) return false;
      const s = synth(), U = window.SpeechSynthesisUtterance;
      if (!s || !U || busy()) return false;
      try {
        const zombie = !!(opts && opts.zombie);
        const u = new U(text);
        u.rate = zombie ? 0.75 : 0.85; u.pitch = zombie ? 0.4 : 1.1; u.volume = 1; u.lang = "en-US";
        const id = ++serial;
        const done = () => { if (id === serial) busyUntil = hardUntil = 0; };
        u.onend = done; u.onerror = done;
        busyUntil = now + 800 + text.length * 80;
        hardUntil = busyUntil + 2000;
        s.speak(u);
        return true;
      } catch (e) { busyUntil = hardUntil = 0; return false; }
    }
  };
})();

// ===================== Engine (no DOM access in this section) =====================
const BZ = (function () {
  const N = 12;
  const TIMING = {
    zombieStepMs: 1200, startFreezeMs: 2000, hopMs: 150, minHopGapMs: 200,
    kickMs: 1500, koMs: 5000, invincibleMs: 1500, dinnerMs: 9000, finaleMs: 18000, maxDtMs: 100
  };
  const ZOMBIE_COUNTS = [2, 3, 4, 5, 7, 9, 12, 20];

  // Diamond view: screen x ~ c - r, screen y ~ c + r.
  const SCREEN_TO_GRID = {
    up: { dc: -1, dr: -1 }, down: { dc: 1, dr: 1 },
    left: { dc: -1, dr: 1 }, right: { dc: 1, dr: -1 },
    upRight: { dc: 0, dr: -1 }, upLeft: { dc: -1, dr: 0 },
    downRight: { dc: 1, dr: 0 }, downLeft: { dc: 0, dr: 1 }
  };
  // Screen angle (0 = right, PI/2 = down) of each key, in 45-degree steps.
  const DIR_BY_OCTANT = ["right", "downRight", "down", "downLeft", "left", "upLeft", "up", "upRight"];

  function angleToScreenDir(rad) {
    const oct = Math.round(rad / (Math.PI / 4));
    return DIR_BY_OCTANT[((oct % 8) + 8) % 8];
  }

  // Seeded PRNG (mulberry32), same as maze_game.html.
  function makeRng(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  const state = {
    phase: "start",
    boardIndex: 0,
    time: 0,
    board: { obstacles: new Map(), hole: { c: -1, r: -1 } },
    bunny: { c: 0, r: 0, fromC: 0, fromR: 0, hopStart: -Infinity, invincibleUntil: 0 },
    zombies: [],
    sceneEndAt: null // simulated time when the dinner / finale scene ends (null otherwise)
  };

  const listeners = {};
  function on(event, fn) { (listeners[event] = listeners[event] || []).push(fn); }
  function emit(event, data) {
    (listeners[event] || []).slice().forEach(fn => fn(data));
  }

  function setPhase(phase) {
    state.phase = phase;
    state.sceneEndAt = null; // every phase change cancels any pending scene timer
    emit("phase", { phase, boardIndex: state.boardIndex });
  }

  // The bunny reached the hole: dinner on boards 1-7, the dance finale on board 8.
  function onWin() {
    emit("win");
    const last = state.boardIndex >= ZOMBIE_COUNTS.length - 1;
    setPhase(last ? "finale" : "dinner");
    state.sceneEndAt = state.time + (last ? TIMING.finaleMs : TIMING.dinnerMs);
  }

  function setBoard(board, bunnyStart, zombieStarts) {
    state.board = board;
    state.time = 0;
    state.bunny = {
      c: bunnyStart.c, r: bunnyStart.r, fromC: bunnyStart.c, fromR: bunnyStart.r,
      hopStart: -Infinity, invincibleUntil: 0
    };
    state.zombies = zombieStarts.map((z, i) => ({
      id: i, c: z.c, r: z.r, fromC: z.c, fromR: z.r,
      stepStart: -Infinity, nextStepAt: TIMING.startFreezeMs + rng() * STAGGER_MS, koUntil: 0, ko: false
    }));
    kick = null;
    setPhase("play");
  }

  function canBunnyEnter(c, r) {
    if (c < 0 || r < 0 || c >= N || r >= N) return false;
    if (state.board.obstacles.has(c + "," + r)) return false;
    for (const z of state.zombies) {
      if (z.koUntil <= state.time && z.c === c && z.r === r) return false;
    }
    return true;
  }

  function tryHop(dirKey) {
    if (state.phase !== "play") return false;
    const d = SCREEN_TO_GRID[dirKey];
    if (!d) return false;
    const b = state.bunny;
    if (state.time < b.hopStart + TIMING.minHopGapMs) return false;
    const c = b.c + d.dc, r = b.r + d.dr;
    if (!canBunnyEnter(c, r)) {
      emit("blocked", { c, r });
      return false;
    }
    b.fromC = b.c; b.fromR = b.r;
    b.c = c; b.r = r;
    b.hopStart = state.time;
    emit("hop", { c, r });
    const hole = state.board.hole;
    if (c === hole.c && r === hole.r) onWin();
    return true;
  }

  // ---- Zombies ----
  const DIRS4 = [{ dc: 0, dr: -1 }, { dc: 1, dr: 0 }, { dc: 0, dr: 1 }, { dc: -1, dr: 0 }];
  const WOBBLE_CHANCE = 0.1;
  const STAGGER_MS = 1200;
  const STEP_JITTER = 0.25;

  function isActive(z) { return z.koUntil <= state.time; }
  function inBounds(c, r) { return c >= 0 && r >= 0 && c < N && r < N; }
  function stepInterval() {
    return TIMING.zombieStepMs * (1 + (rng() * 2 - 1) * STEP_JITTER);
  }

  // Squares a zombie may stand on: on the board, no obstacle, not the hole, no other active zombie.
  function zombieCanStand(z, c, r) {
    if (!inBounds(c, r) || state.board.obstacles.has(c + "," + r)) return false;
    const hole = state.board.hole;
    if (c === hole.c && r === hole.r) return false;
    for (const o of state.zombies) {
      if (o !== z && isActive(o) && o.c === c && o.r === r) return false;
    }
    return true;
  }

  // Shortest 4-direction path (BFS) to the bunny's claimed square; returns the first step.
  function pathStep(z) {
    const goal = state.bunny;
    const key = (c, r) => r * N + c;
    const first = new Map();
    const queue = [];
    for (const d of DIRS4) {
      const c = z.c + d.dc, r = z.r + d.dr;
      if (c === goal.c && r === goal.r) return { c, r };
      if (zombieCanStand(z, c, r)) { first.set(key(c, r), { c, r }); queue.push({ c, r }); }
    }
    for (let i = 0; i < queue.length; i++) {
      const cur = queue[i];
      const start = first.get(key(cur.c, cur.r));
      for (const d of DIRS4) {
        const c = cur.c + d.dc, r = cur.r + d.dr;
        if (c === goal.c && r === goal.r) return start;
        if (first.has(key(c, r)) || (c === z.c && r === z.r) || !zombieCanStand(z, c, r)) continue;
        first.set(key(c, r), start);
        queue.push({ c, r });
      }
    }
    return null;
  }

  function zombieNextStep(z) {
    if (rng() < WOBBLE_CHANCE) {
      // Wobble: pause to groan, or take a random legal step.
      if (rng() < 0.5) return null;
      const options = DIRS4.map(d => ({ c: z.c + d.dc, r: z.r + d.dr }))
        .filter(p => zombieCanStand(z, p.c, p.r) && !(p.c === state.bunny.c && p.r === state.bunny.r));
      return options.length ? options[Math.floor(rng() * options.length)] : null;
    }
    return pathStep(z);
  }

  function nearestZombieDistance() {
    let best = Infinity;
    for (const z of state.zombies) {
      if (isActive(z)) best = Math.min(best, Math.abs(z.c - state.bunny.c) + Math.abs(z.r - state.bunny.r));
    }
    return best;
  }

  let kick = null; // { zombieId, endAt } while phase === "kick"

  function chebyshev(c, r, hole) { return Math.max(Math.abs(c - hole.c), Math.abs(r - hole.r)); }

  function victoryHop() {
    const b = state.bunny, hole = state.board.hole;
    const here = chebyshev(b.c, b.r, hole);
    let safe = null, any = null;
    for (let dc = -1; dc <= 1; dc++) {
      for (let dr = -1; dr <= 1; dr++) {
        const c = b.c + dc, r = b.r + dr;
        if (!(dc || dr) || !inBounds(c, r) || state.board.obstacles.has(c + "," + r)) continue;
        if (state.zombies.some(z => z.c === c && z.r === r)) continue;
        const dist = chebyshev(c, r, hole);
        if (dist >= here) continue;
        const cand = { c, r, dist };
        if (!any || dist < any.dist) any = cand;
        const nearActive = state.zombies.some(z => isActive(z) && Math.max(Math.abs(z.c - c), Math.abs(z.r - r)) <= 1);
        if (!nearActive && (!safe || dist < safe.dist)) safe = cand;
      }
    }
    const pick = safe || any;
    if (pick) {
      b.fromC = b.c; b.fromR = b.r;
      b.c = pick.c; b.r = pick.r;
      b.hopStart = state.time;
    }
    b.invincibleUntil = state.time + TIMING.invincibleMs;
    emit("victory-hop", { c: b.c, r: b.r });
    if (pick && b.c === hole.c && b.r === hole.r) onWin();
  }

  function finishKick() {
    const z = state.zombies[kick.zombieId];
    kick = null;
    z.koUntil = state.time + TIMING.koMs;
    z.ko = true;
    for (const o of state.zombies) o.nextStepAt += TIMING.kickMs; // the freeze delays everyone's schedule
    emit("kick", { zombieId: z.id });
    setPhase("play"); // back to play first, so a win during the victory hop ends in dinner/finale
    victoryHop();
  }

  function wakeZombies() {
    for (const z of state.zombies) {
      if (!z.ko || state.time < z.koUntil) continue;
      const b = state.bunny;
      const occupied = (b.c === z.c && b.r === z.r) ||
        state.zombies.some(o => o !== z && isActive(o) && o.c === z.c && o.r === z.r);
      if (occupied) { z.koUntil = state.time + TIMING.maxDtMs; continue; } // wait until the square is free
      z.ko = false;
      z.nextStepAt = state.time + stepInterval();
      emit("ko-wake", { zombieId: z.id });
    }
  }

  function stepZombies() {
    if (state.time < TIMING.startFreezeMs) return;
    for (const z of state.zombies) {
      if (state.phase !== "play") return;
      if (!isActive(z) || state.time < z.nextStepAt) continue;
      z.nextStepAt = state.time + stepInterval();
      const step = zombieNextStep(z);
      if (!step) continue;
      const b = state.bunny;
      if (step.c === b.c && step.r === b.r) {
        if (state.time < b.invincibleUntil) continue; // can't catch yet
        kick = { zombieId: z.id, endAt: state.time + TIMING.kickMs };
        setPhase("kick");
        emit("catch", { zombieId: z.id });
        return;
      }
      z.fromC = z.c; z.fromR = z.r;
      z.c = step.c; z.r = step.r;
      z.stepStart = state.time;
    }
  }

  function tick(dtMs) {
    state.time += Math.min(Math.max(dtMs, 0), TIMING.maxDtMs);
    if (state.phase === "dinner") {
      if (state.sceneEndAt !== null && state.time >= state.sceneEndAt) nextBoard();
      return;
    }
    if (state.phase !== "play" && state.phase !== "kick") return; // start, finale: nothing moves
    wakeZombies();
    if (state.phase === "kick") {
      if (kick && state.time >= kick.endAt) finishKick();
    } else if (state.phase === "play") {
      stepZombies();
    }
  }

  // ---- Boards ----

    c.beginPath(); for (let i = 0; i < 4; i++) { c.moveTo(-0.11 + i * 0.027, -0.64); c.lineTo(-0.11 + i * 0.027, -0.62); } c.stroke();
    poly(c, [0.08, -0.55, 0.14, -0.52, 0.1, -0.47]); paint(c, ZC.skinDark);

    poly(c, [-0.15, -1.0, -0.1, -1.12, -0.04, -1.05, 0.0, -1.15, 0.05, -1.06, 0.12, -1.13, 0.14, -1.03, 0.2, -1.0, 0.12, -1.04, 0.0, -1.05]);

  // ---------- obstacles (anchored at the square's centre, size = tile width T) ----------
  function drawRock(c, x, y, T, v) {
    const k = 0.9 + v * 0.25, line = "rgba(60,64,70,0.45)", lw = Math.max(1, T * 0.025);
    ell(c, x - 0.02 * T, y - 0.2 * T * k, 0.36 * T * k, 0.27 * T * k); paint(c, "#9aa1a8", line, lw);
    ell(c, x - 0.09 * T, y - 0.3 * T * k, 0.17 * T * k, 0.1 * T * k, -0.3); paint(c, "#bfc5cb");
    ell(c, x + 0.26 * T, y - 0.07 * T, 0.13 * T, 0.09 * T); paint(c, "#8a9198", line, lw);
    if (v > 0.5) { ell(c, x + 0.06 * T, y - 0.42 * T * k, 0.12 * T, 0.045 * T); paint(c, "#8fbf6a"); }
    c.strokeStyle = "rgba(70,74,80,0.5)"; c.lineWidth = lw;
    c.beginPath(); c.moveTo(x + 0.08 * T, y - 0.34 * T * k); c.lineTo(x + 0.13 * T, y - 0.22 * T * k); c.lineTo(x + 0.09 * T, y - 0.13 * T * k); c.stroke();
  }
  function drawBush(c, x, y, T, v) {
    const k = 0.92 + v * 0.18, line = "rgba(40,80,30,0.45)", lw = Math.max(1, T * 0.025);
    blobs(c, [[x - 0.17 * T * k, y - 0.2 * T * k, 0.2 * T * k], [x + 0.17 * T * k, y - 0.2 * T * k, 0.2 * T * k], [x, y - 0.36 * T * k, 0.23 * T * k]]);
    c.strokeStyle = line; c.lineWidth = lw * 2; c.stroke(); c.fillStyle = "#5a9e3c"; c.fill();
    circ(c, x - 0.07 * T, y - 0.43 * T * k, 0.09 * T); paint(c, "#73b853");
    circ(c, x + 0.17 * T, y - 0.27 * T * k, 0.06 * T); paint(c, "#73b853");
    if (v < 0.6) {
      for (const [dx, dy] of [[-0.18, -0.22], [0.08, -0.3], [0.2, -0.14]]) { circ(c, x + dx * T, y + dy * T * k, 0.035 * T); paint(c, "#e2475b"); }
    }
  }
  function drawTree(c, x, y, T, v) {
    const k = 0.92 + v * 0.16, line = "rgba(40,70,30,0.45)", lw = Math.max(1, T * 0.025);
    rrect(c, x - 0.07 * T, y - 0.6 * T * k, 0.14 * T, 0.6 * T * k, 0.04 * T); paint(c, "#8b5a2b", "rgba(70,40,20,0.5)", lw);
    blobs(c, [[x - 0.2 * T, y - 0.68 * T * k, 0.25 * T], [x + 0.2 * T, y - 0.7 * T * k, 0.25 * T], [x, y - 0.95 * T * k, 0.3 * T]]);
    c.strokeStyle = line; c.lineWidth = lw * 2; c.stroke(); c.fillStyle = "#3f8f3a"; c.fill();
    circ(c, x - 0.08 * T, y - 1.03 * T * k, 0.14 * T); paint(c, "#56a84b");
    circ(c, x + 0.2 * T, y - 0.78 * T * k, 0.1 * T); paint(c, "#56a84b");
    if (v > 0.45) {
      for (const [dx, dy] of [[-0.22, -0.7], [0.12, -0.92], [0.24, -0.62]]) { circ(c, x + dx * T, y + dy * T * k, 0.045 * T); paint(c, "#e74c3c"); }
    }
  }
  const OBSTACLE_DRAW = { rock: drawRock, bush: drawBush, tree: drawTree };

  // ---------- the static board: backdrop, grassy diamond with earth edges, the hole ----------
  function drawBackdrop(c) {
    const gr = c.createLinearGradient(0, 0, L.w, L.h);
    gr.addColorStop(0, "#fef9f0"); gr.addColorStop(1, "#fdf2e3");
    c.fillStyle = gr; c.fillRect(0, 0, L.w, L.h);
  }
  function drawHole(c, x, y, T) {
    ell(c, x, y, 0.47 * T, 0.25 * T); paint(c, "#8b6b47", "rgba(80,55,30,0.5)", Math.max(1, T * 0.025));
    ell(c, x, y - 0.03 * T, 0.38 * T, 0.18 * T); paint(c, "#a5825a");
    ell(c, x, y + 0.01 * T, 0.31 * T, 0.15 * T); paint(c, "#2b1d12");
    for (const [dx, dy] of [[-0.42, 0.12], [0.4, 0.1], [0.3, 0.2]]) { circ(c, x + dx * T, y + dy * T, 0.035 * T); paint(c, "#7a5a3a"); }
  }
  function buildGround() {
    groundCv.width = canvas.width; groundCv.height = canvas.height;
    const c = gg, T = L.T, D = 0.42 * T;
    c.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    drawBackdrop(c);
    const top = { x: L.ox, y: L.oy }, right = { x: L.ox + 6 * T, y: L.oy + 3 * T };
    const bottom = { x: L.ox, y: L.oy + 6 * T }, left = { x: L.ox - 6 * T, y: L.oy + 3 * T };
    // soft shadow under the island
    ell(c, L.ox, bottom.y - 1.6 * T + D, 6.2 * T, 2.2 * T); paint(c, "rgba(120,90,50,0.10)");
    // earth sides
    poly(c, [left.x, left.y, bottom.x, bottom.y, bottom.x, bottom.y + D, left.x, left.y + D]); paint(c, "#a8794e");
    poly(c, [bottom.x, bottom.y, right.x, right.y, right.x, right.y + D, bottom.x, bottom.y + D]); paint(c, "#8d6240");
    for (let i = 0; i < 26; i++) { // pebbles in the earth
      const u = hash(i, 3), d = 0.35 + hash(i, 4) * 0.5, onLeft = i % 2 === 0;
      const a = onLeft ? left : bottom, b = onLeft ? bottom : right;
      ell(c, lerp(a.x, b.x, u), lerp(a.y, b.y, u) + d * D, 0.07 * T, 0.035 * T); paint(c, onLeft ? "#93673f" : "#7a5434");
    }
    // grass top
    const gr = c.createLinearGradient(0, top.y, 0, bottom.y);
    gr.addColorStop(0, "#b8e294"); gr.addColorStop(1, "#98cc70");
    poly(c, [top.x, top.y, right.x, right.y, bottom.x, bottom.y, left.x, left.y]); paint(c, gr);
    c.save();
    poly(c, [top.x, top.y, right.x, right.y, bottom.x, bottom.y, left.x, left.y]); c.clip();
    const hole = S.board.hole;
    for (let i = 0; i < 9; i++) { // light patches, not aligned to squares
      const p = P(hash(i, 7) * 12 - 0.5, hash(i, 8) * 12 - 0.5);
      ell(c, p.x, p.y, (0.9 + hash(i, 9)) * T, (0.45 + hash(i, 9) * 0.5) * T); paint(c, "rgba(255,255,220,0.18)");
    }
    c.strokeStyle = "#7fb55a"; c.lineWidth = Math.max(1, T * 0.035); c.lineCap = "round";
    for (let i = 0; i < 90; i++) { // grass tufts
      const cc = hash(i, 1) * 12 - 0.5, rr = hash(i, 2) * 12 - 0.5;
      if (Math.abs(cc - hole.c) < 0.8 && Math.abs(rr - hole.r) < 0.8) continue;
      const p = P(cc, rr), h = T * 0.09;
      c.beginPath(); c.moveTo(p.x - h * 0.6, p.y - h); c.lineTo(p.x, p.y); c.lineTo(p.x + h * 0.6, p.y - h); c.moveTo(p.x, p.y); c.lineTo(p.x, p.y - h * 1.2); c.stroke();
    }
    const petals = ["#ffffff", "#ffe066", "#ffb3c7"];
    for (let i = 0; i < 18; i++) { // tiny flowers
      const cc = hash(i, 5) * 12 - 0.5, rr = hash(i, 6) * 12 - 0.5;
      if (Math.abs(cc - hole.c) < 0.9 && Math.abs(rr - hole.r) < 0.9) continue;
      const p = P(cc, rr), f = T * 0.045;
      c.fillStyle = petals[i % 3];
      for (let j = 0; j < 5; j++) { const a = j * TAU / 5; circ(c, p.x + Math.cos(a) * f, p.y + Math.sin(a) * f * 0.6, f * 0.7); c.fill(); }
      circ(c, p.x, p.y, f * 0.6); paint(c, "#f5a623");
    }
    c.restore();
    // grassy lip along the front edges
    c.fillStyle = "#86bf5e";
    for (const [a, b] of [[left, bottom], [bottom, right]]) {
      for (let i = 0; i <= 24; i++) { const u = i / 24; ell(c, lerp(a.x, b.x, u), lerp(a.y, b.y, u) + 0.04 * T, 0.16 * T, 0.09 * T); c.fill(); }
    }
    c.strokeStyle = "rgba(255,255,255,0.35)"; c.lineWidth = Math.max(1, T * 0.03);
    c.beginPath(); c.moveTo(left.x, left.y); c.lineTo(top.x, top.y); c.lineTo(right.x, right.y); c.stroke();
    if (hole.c >= 0) { const hp = P(hole.c, hole.r); drawHole(c, hp.x, hp.y, T); }
    // obstacles never move: their flat shadows go into the ground, and each one gets its own sprite
    c.fillStyle = "rgba(40,60,20,0.2)";
    for (const o of obstacles) { const p = P(o.c, o.r); ell(c, p.x, p.y + 0.02 * T, 0.4 * T, 0.14 * T); c.fill(); }
    for (const o of obstacles) buildObstacleSprite(o);
  }
  // A sprite covers the obstacle's box (-0.55..0.55 T wide, -1.45..0.15 T tall around the square's centre) and is
  // placed on whole device pixels with the sub-pixel offset drawn into it, so it looks exactly like drawing it directly.
  function buildObstacleSprite(o) {
    const T = L.T, d = L.dpr, p = P(o.c, o.r);
    const x0 = Math.floor((p.x - 0.55 * T) * d), y0 = Math.floor((p.y - 1.45 * T) * d);
    const w = Math.ceil(1.1 * T * d) + 2, h = Math.ceil(1.6 * T * d) + 2;
    const spr = o.spr || (o.spr = document.createElement("canvas"));
    spr.width = w; spr.height = h;
    const c = spr.getContext("2d");
    c.setTransform(d, 0, 0, d, -x0, -y0);
    OBSTACLE_DRAW[o.kind](c, p.x, p.y, T, o.v);
    o.sx = x0 / d; o.sy = y0 / d; o.sw = w / d; o.sh = h / d;
  }
  function ensureGround() {
    if (groundBoard !== S.board) {
      groundBoard = S.board; groundKey = "";
      obstacles = [];
      for (const [k, kind] of S.board.obstacles) {
        const [c, r] = k.split(",").map(Number);
        const o = { c, r, kind, v: hash(c + 0.5, r + 0.25), spr: null, sx: 0, sy: 0, sw: 0, sh: 0 };
        o.item = { d: c + r, x: c - r, kind, o }; // its (static) entry in the depth-sorted draw list
        obstacles.push(o);
      }
    }
    if (groundKey !== L.key) { buildGround(); groundKey = L.key; }
  }

  // ---------- poses ----------
  function screenX(c, r) { return c - r; }
  function bunnyPose() {
    const b = S.bunny, T = L.T;
    const t = clamp01((S.time - b.hopStart) / TM.hopMs);
    const o = { c: lerp(b.fromC, b.c, t), r: lerp(b.fromR, b.r, t), lift: Math.sin(Math.PI * t) * 0.4 * T, kick: 0, f: anim.bunnyF };
    const st = S.time - anim.shakeAt;
    if (st >= 0 && st < SHAKE_MS) { // bumped into something: a small sideways wobble (c+k, r-k moves along screen x only)
      const k = Math.sin(st / SHAKE_MS * 4 * Math.PI) * 0.1 * (1 - st / SHAKE_MS);
      o.c += k; o.r -= k;
    }
    if (S.phase === "kick" && anim.kick) {
      const kt = S.time - anim.kick.t0, z = S.zombies[anim.kick.id];
      if (z) { const dx = screenX(z.c, z.r) - screenX(b.c, b.r); if (dx) o.f = dx > 0 ? 1 : -1; }
      const up = kt < 260 ? ease(kt / 260) : kt < 1000 ? 1 : 1 - ease(clamp01((kt - 1000) / 300));
      o.lift = up * 0.85 * T + (kt > 260 && kt < 1000 ? Math.sin(kt / 70) * 0.04 * T : 0);
      o.kick = kt < 520 ? 0 : kt < 700 ? ease((kt - 520) / 180) : kt < 1050 ? 1 - 0.4 * clamp01((kt - 700) / 350) : 0;
    }
    return o;
  }
  function zombiePose(z) {
    const t = S.time, T = L.T;
    const st = clamp01((t - z.stepStart) / 520);
    const e = ease(st), moving = st < 1;
    const o = { c: lerp(z.fromC, z.c, e), r: lerp(z.fromR, z.r, e), lift: 0, seed: z.id * 1.7 };
    let f = anim.faceZ.get(z.id) || 1;
    const dx = screenX(S.bunny.c, S.bunny.r) - screenX(z.c, z.r);
    if (dx) f = dx > 0 ? 1 : -1;
    o.f = f;
    o.tilt = moving ? Math.sin(st * TAU) * 0.12 : Math.sin(t / 380 + o.seed) * 0.05;
    o.walk = moving ? st * TAU * 1.5 : 0;
    o.lift = moving ? Math.abs(Math.sin(st * TAU)) * 0.05 * T : 0;
    const victim = S.phase === "kick" && anim.kick && anim.kick.id === z.id;
    if (victim) {
      const kt = t - anim.kick.t0;
      o.f = f = anim.fallF.get(z.id) || f;
      if (kt < 900) {
        o.armF = -0.9 + Math.sin(kt / 45) * 0.9; o.armB = -0.9 + Math.cos(kt / 50) * 0.9;
        o.tilt = Math.sin(kt / 60) * 0.12; o.open = true;
      }
      if (kt >= 850) { const k = clamp01((kt - 850) / 450); o.fall = ease(k) - Math.sin(clamp01((kt - 1300) / 200) * Math.PI) * 0.06; o.tilt = 0; o.dizzy = kt > 1100; }
      o.burst = kt >= 650 && kt < 1150 ? (kt - 650) / 500 : 0;
    } else if (z.ko) {
      o.f = f = anim.fallF.get(z.id) || f;
      o.fall = 1; o.tilt = 0; o.dizzy = true; o.stars = true; o.armF = 0.2; o.armB = 0.1;
    } else if (anim.wakeAt.has(z.id)) {
      const wt = t - anim.wakeAt.get(z.id);
      if (wt < 350) { o.f = f = anim.fallF.get(z.id) || f; o.fall = 1 - ease(wt / 350); o.dizzy = true; }
      else if (wt < 1050) o.tilt = Math.sin((wt - 350) / 55) * 0.22 * (1 - (wt - 350) / 700);
      else anim.wakeAt.delete(z.id);
    }
    anim.faceZ.set(z.id, f);
    return o;
  }

  // ---------- play scene ----------
  const drawItems = [];
  const byDepth = (a, b) => a.d - b.d || a.x - b.x;
  function drawPlay(bunnyOverride) {
    const T = L.T, t = S.time;
    ensureGround();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(groundCv, 0, 0);
    g.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    const hole = S.board.hole;
    if (hole.c >= 0 && S.phase === "play") { // the hole glows softly so it is easy to find
      const hp = P(hole.c, hole.r), a = 0.35 + 0.25 * Math.sin(t / 300);
      ell(g, hp.x, hp.y, 0.58 * T, 0.31 * T); g.strokeStyle = "rgba(255,214,90," + a.toFixed(3) + ")"; g.lineWidth = Math.max(2, T * 0.07); g.stroke();
    }
    if (glowCell && S.phase === "play") { // the square a held finger would hop to
      const gp = P(glowCell.c, glowCell.r), a = 0.34 + 0.12 * Math.sin(t / 160), hw = T * 0.46, hh = T * 0.23;
      g.beginPath(); g.moveTo(gp.x, gp.y - hh); g.lineTo(gp.x + hw, gp.y); g.lineTo(gp.x, gp.y + hh); g.lineTo(gp.x - hw, gp.y); g.closePath();
      g.fillStyle = "rgba(255,230,120," + a.toFixed(3) + ")"; g.fill();
      g.strokeStyle = "rgba(255,200,70,0.8)"; g.lineWidth = Math.max(2, T * 0.05); g.stroke();
    }
    // Depth-sorted draw list; obstacle entries are built once per board, the array is reused frame to frame.
    const items = drawItems;
    items.length = 0;
    for (const o of obstacles) items.push(o.item);
    for (const z of S.zombies) { const o = zombiePose(z); items.push({ d: o.c + o.r + (o.fall ? 0.3 : 0), x: o.c - o.r, kind: "zombie", o }); }
    const bp = bunnyOverride || bunnyPose();
    if (!bp.hidden) items.push({ d: bp.c + bp.r + 0.01, x: bp.c - bp.r, kind: "bunny", o: bp });
    items.sort(byDepth);
    // shadows first (flat on the ground; the obstacles' shadows are already in the ground image)
    g.fillStyle = "rgba(40,60,20,0.2)";
    for (const it of items) {
      if (it.kind !== "zombie" && it.kind !== "bunny") continue;
      const p = P(it.o.c, it.o.r);
      it.p = p;
      if (it.kind === "zombie") { const k = it.o.fall || 0; ell(g, p.x, p.y + 0.02 * T, (0.3 + 0.35 * k) * T, 0.12 * T); g.fill(); }
      else { const k = 1 - Math.min(0.5, it.o.lift / T * 0.5); ell(g, p.x, p.y + 0.02 * T, 0.3 * T * k * (it.o.scale || 1), 0.11 * T * k); g.fill(); }
    }
    const ZS = 1.35 * T, BS = 1.2 * T;
    let bunnyAt = null, overlays = 0;
    for (const it of items) {
      const o = it.o;
      if (it.kind === "zombie") {
        drawZombie(g, it.p.x, it.p.y, ZS, o);
        if (o.stars || o.burst) overlays++;
      } else if (it.kind === "bunny") {
        g.save(); g.translate(it.p.x, it.p.y); const sc = o.scale || 1; g.scale(sc, sc);
        drawBunny(g, 0, o.sink ? o.sink * T : 0, BS, o);
        g.restore();
        bunnyAt = it;
      } else {
        g.drawImage(o.spr, o.sx, o.sy, o.sw, o.sh);
      }
    }
    // the bunny shows through anything standing in front of it
    if (bunnyAt && !bunnyAt.o.scale) { g.globalAlpha = 0.3; drawBunny(g, bunnyAt.p.x, bunnyAt.p.y, BS, bunnyAt.o); g.globalAlpha = 1; }
    if (hole.c >= 0 && (S.phase === "play" || S.phase === "kick")) holeMarker(P(hole.c, hole.r));
    if (overlays) { // KO stars and BONK bursts go on top of everything
      for (const it of items) {
        if (it.kind !== "zombie") continue;
        if (it.o.stars) koStars(it.p, it.o);
        if (it.o.burst) bonk(it.p, it.o);
      }
    }
    if (bunnyAt && t < S.bunny.invincibleUntil && S.phase === "play") { // sparkly "can't be caught" time
      const p = bunnyAt.p, o = bunnyAt.o;
      for (let i = 0; i < 5; i++) {
        const a = t / 260 + i * TAU / 5;
        twinkle(g, p.x + Math.cos(a) * 0.45 * T, p.y - o.lift - 0.55 * T + Math.sin(a) * 0.3 * T, 0.11 * T * (0.7 + 0.4 * Math.sin(t / 90 + i)));
      }

  BZ.on("blocked", () => { if (S.time - anim.shakeAt >= SHAKE_MS) anim.shakeAt = S.time; });
  BZ.on("hop", d => { const dx = (d.c - d.r) - (S.bunny.fromC - S.bunny.fromR); if (dx) anim.bunnyF = dx > 0 ? 1 : -1; });
  BZ.on("victory-hop", () => { const b = S.bunny, dx = (b.c - b.r) - (b.fromC - b.fromR); if (dx) anim.bunnyF = dx > 0 ? 1 : -1; });
  BZ.on("phase", d => {
    if (d.phase === "play" && S.time === 0) { // a new board: forget old animations
      anim.kick = null; anim.fallF.clear(); anim.wakeAt.clear(); anim.faceZ.clear(); anim.bunnyF = 1; anim.shakeAt = -Infinity;
    }
    syncDom(); // overlays and the label follow the phase at once, not a frame later
  });
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", layout);

  return {
    cellToScreen, screenToCell, render,
    setGlow(cell) { glowCell = cell ? { c: cell.c, r: cell.r } : null; },
    glowCell() { return glowCell; },
    get tile() { layout(); return L.T; }
  };
})();

// ===================== Input: tap / hold / keyboard (no drawing here) =====================
// Hops only come from a press that began during "play"; every phase change forgets all presses, so a
// finger or key still down from a scene (kick, dinner, finale, board load) must lift and press again.
BZ.input = (function () {
  const S = BZ.state, GAP = BZ.TIMING.minHopGapMs, COMBO_MS = 70; // COMBO_MS: lets W+D land as one diagonal
  const boardEl = document.getElementById("board");
  const seedParam = new URLSearchParams(location.search).get("seed");
  const pointers = new Map(); // pointerId -> {x, y}: fingers/mouse pressed on the board during play
  const keys = new Set();     // KeyboardEvent.code of direction keys pressed during play
  let lastTry = -Infinity;    // S.time of the last hop attempt, so a hold retries once per hop window
  let comboAt = null, combo = null; // engine time the first-key grace ends, and the keys pressed during it
  const KEYDIR = { KeyW: [0, -1], ArrowUp: [0, -1], KeyS: [0, 1], ArrowDown: [0, 1],
    KeyA: [-1, 0], ArrowLeft: [-1, 0], KeyD: [1, 0], ArrowRight: [1, 0] };
  const NAME = { "0,-1": "up", "0,1": "down", "-1,0": "left", "1,0": "right",
    "1,-1": "upRight", "-1,-1": "upLeft", "1,1": "downRight", "-1,1": "downLeft" };

  function keyDir() { return keyDirOf(keys); }
  function keyDirOf(set) {
    let dx = 0, dy = 0;
    for (const k of set) { dx += KEYDIR[k][0]; dy += KEYDIR[k][1]; }
    return NAME[Math.sign(dx) + "," + Math.sign(dy)]; // opposite keys cancel -> undefined
  }
  const GRID_DIR = {}; // "dc,dr" -> screen direction name
  for (const [k, d] of Object.entries(BZ.SCREEN_TO_GRID)) GRID_DIR[d.dc + "," + d.dr] = k;
  // A finger steers by the square under it: one grid step toward that square (straight onto it when it is a
  // neighbour), nothing when it is the bunny's own square. Off the board: the square it would be.
  function pointerDir(p) {
    const b = S.bunny, cell = BZ.view.screenToCell(p.x, p.y);
    let dc, dr;
    if (cell) { dc = cell.c - b.c; dr = cell.r - b.r; } else {
      const o = BZ.view.cellToScreen(b.c, b.r), T = BZ.view.tile, u = (p.x - o.x) / (T / 2), v = (p.y - o.y) / (T / 4);
      dc = Math.round((u + v) / 2); dr = Math.round((v - u) / 2);
    }
    return GRID_DIR[Math.sign(dc) + "," + Math.sign(dr)]; // "0,0" (on the bunny's square) -> undefined
  }
  function lastPointer() { let p = null; for (const v of pointers.values()) p = v; return p; }
  function attempt(dir) { lastTry = S.time; return BZ.tryHop(dir); }
  function showGlow() {
    const p = S.phase === "play" ? lastPointer() : null, dir = p && pointerDir(p), d = dir && BZ.SCREEN_TO_GRID[dir];
    const c = d ? S.bunny.c + d.dc : 0, r = d ? S.bunny.r + d.dr : 0;
    BZ.view.setGlow(d && BZ.canBunnyEnter(c, r) ? { c, r } : null);
  }
  function forget() {
    pointers.clear(); keys.clear(); lastTry = -Infinity;
    comboAt = null; combo = null;
    BZ.view.setGlow(null);
  }

  // Called every frame: a held finger or key hops again once the hop window has passed.
  function pump() {
    if (S.phase !== "play") return;
    showGlow();
    if (comboAt !== null) { // first key press waits a moment so W+D lands as one diagonal, even for a quick tap
      if (S.time < Math.max(comboAt, lastTry + GAP)) return;
      const dir = keyDirOf(combo);
      comboAt = null; combo = null;
      if (dir) attempt(dir);
      return;
    }
    if (S.time < lastTry + GAP) return;
    const p = lastPointer(), dir = keyDir() || (p && pointerDir(p));
    if (dir) attempt(dir);
  }

  // ---- fingers and mouse, on the board only ----
  boardEl.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (e.pointerType === "mouse" && e.button !== 0) return;
    if (S.phase !== "play") return;
    try { boardEl.setPointerCapture(e.pointerId); } catch (err) { /* synthetic or finished pointer */ }
    const p = { x: e.clientX, y: e.clientY };
    pointers.set(e.pointerId, p);
    const dir = pointerDir(p);
    if (dir) attempt(dir);
    showGlow();
  });
  boardEl.addEventListener("pointermove", e => {
    const p = pointers.get(e.pointerId);
    if (p) { p.x = e.clientX; p.y = e.clientY; showGlow(); }
  });
  function lift(e) { if (pointers.delete(e.pointerId)) showGlow(); }
  boardEl.addEventListener("pointerup", lift);
  boardEl.addEventListener("pointercancel", lift);
  boardEl.addEventListener("lostpointercapture", lift);
  boardEl.addEventListener("contextmenu", e => e.preventDefault());

  // ---- keyboard ----
  document.addEventListener("keydown", e => {
    if ((e.code === "Enter" || e.code === "Space") && (S.phase === "start" || (S.phase === "finale" && !document.getElementById("play-again").classList.contains("hidden")))) {
      e.preventDefault();
      if (!e.repeat) { if (S.phase === "start") startPlay(); else BZ.playAgain(); }
      return;
    }
    if (!KEYDIR[e.code]) return;
    e.preventDefault();
    if (e.repeat || keys.has(e.code) || S.phase !== "play") return; // OS key repeat is ignored; pump() repeats hops
    keys.add(e.code);
    if (comboAt === null) { comboAt = S.time + COMBO_MS; combo = new Set(); } // grace runs on engine time, in pump()
    combo.add(e.code); // remembered even if the key is released before the grace ends
  });
  document.addEventListener("keyup", e => { keys.delete(e.code); });
  window.addEventListener("blur", forget);
  document.addEventListener("visibilitychange", forget);
  BZ.on("phase", forget);

  // ---- buttons and the dinner tap: one pointer path each (pointerdown then pointerup, never click) ----
  function startPlay() { Sound.unlock(); BZ.startGame(seedParam); }
  function tapOnce(el, fn) {
    let down = false;
    el.addEventListener("pointerdown", e => { down = true; e.preventDefault(); });
    el.addEventListener("pointerup", () => { if (down) { down = false; fn(); } });
    el.addEventListener("pointercancel", () => { down = false; });
    el.addEventListener("pointerleave", () => { down = false; });
  }
  tapOnce(document.getElementById("tap-to-play"), () => { if (S.phase === "start") startPlay(); });
  tapOnce(document.getElementById("play-again"), () => BZ.playAgain());

  // A tap anywhere skips the dinner, but only a finger that went down during the dinner.
  // Taps in the first 3 s are ignored, so a tap-happy child still sees the bunny get home and the family table.
  const dinnerDown = new Set(), SKIP_AFTER_MS = 3000;
  const onToggle = e => e.target.closest && e.target.closest("#topbar");
  const dinnerAge = () => S.time - (S.sceneEndAt - BZ.TIMING.dinnerMs);
  document.addEventListener("pointerdown", e => { if (S.phase === "dinner" && !onToggle(e)) dinnerDown.add(e.pointerId); });
  document.addEventListener("pointerup", e => { if (dinnerDown.delete(e.pointerId) && S.phase === "dinner" && dinnerAge() >= SKIP_AFTER_MS) BZ.skipScene(); });
  document.addEventListener("pointercancel", e => { dinnerDown.delete(e.pointerId); });
  BZ.on("phase", () => dinnerDown.clear());

  return { pump };
})();

// ===================== Sound director: turns engine events and simulated time into sounds and lines =====================
(function () {
  const LINES = ["I will eat the bunny!", "Come here, rabbit!", "I have a carrot for you, bunny!", "Call more Zombies!", "Bunny brains are YUMMY!"];
  const WELCOME = "Welcome home! You made it, " + PLAYER_NAME + "!";
  const S = BZ.state;
  let now = 0;                 // accumulated simulated ms (S.time restarts on every board, this does not)
  let nextLineAt = null, nextGrowlAt = 0, nextMunchAt = 0, munchCount = 0, lastThudAt = -1e9, welcomePending = false;
  // Private PRNG: the engine's seeded stream (zombie moves, boards) must never be touched by sound.
  const seedQ = new URLSearchParams(location.search).get("seed");
  const soundRng = BZ.makeRng((seedQ !== null && seedQ !== "" && !isNaN(Number(seedQ)) ? Number(seedQ) : Date.now()) ^ 0x5EED);
  const lineGap = () => 4000 + soundRng() * 3000;

  // Runs after every engine tick (the frame loop and ?manual tests both go through BZ.tick).
  const engineTick = BZ.tick;
  BZ.tick = function (dtMs) {
    now += Math.min(Math.max(dtMs, 0), BZ.TIMING.maxDtMs) || 0;
    Speech.tick(now);
    engineTick(dtMs);
    if (!Sound.isUnlocked()) return;
    if (S.phase === "play") {
      if (S.time >= BZ.TIMING.startFreezeMs && now >= nextGrowlAt) {
        const d = BZ.nearestZombieDistance(); // Infinity when nobody is active
        if (d <= 4) { Sound.growl(Math.max(d, 1)); nextGrowlAt = now + 500 + (Math.max(d, 1) - 1) * 450; }
      }
      if (nextLineAt === null) nextLineAt = now + lineGap();
      else if (now >= nextLineAt) { Speech.say(LINES[Math.floor(soundRng() * LINES.length)], { zombie: true }); nextLineAt = now + lineGap(); }
    } else if (S.phase === "dinner") {
      if (welcomePending && Speech.say(WELCOME, { zombie: false })) welcomePending = false;
      if (now >= nextMunchAt) { Sound.munch(munchCount++); nextMunchAt = now + 420; }
    } else if (S.phase === "finale") {
      Sound.tuneUpdate();
    }
  };

  let prevPhase = "start";
  BZ.on("phase", d => {
    if (d.phase !== "kick" && !(d.phase === "play" && prevPhase === "kick")) nextLineAt = null; // a kick doesn't restart the zombie-line clock
    prevPhase = d.phase;
    welcomePending = d.phase === "dinner";
    nextMunchAt = now + 600; munchCount = 0;
    if (d.phase !== "finale") Sound.stopTune();
  });
  BZ.on("hop", () => Sound.boing());
  BZ.on("victory-hop", () => Sound.boing());
  BZ.on("blocked", () => { if (now - lastThudAt >= 600) { lastThudAt = now; Sound.thud(); } }); // held against a wall: not a machine gun
  BZ.on("kick", () => { Sound.bonk(); Sound.groan(); });

  // Any touch or key wakes a suspended audio context (pointerup too: for touch it is the gesture iOS honours).
  for (const ev of ["pointerdown", "pointerup", "keydown"]) document.addEventListener(ev, () => Sound.wake(), true);

  // Sound button: one pointer path, like the other buttons.
  const toggle = document.getElementById("sound-toggle");
  let down = false;
  toggle.addEventListener("pointerdown", e => { down = true; e.preventDefault(); });
  toggle.addEventListener("pointerup", () => {
    if (!down) return;
    down = false;
    const m = !Sound.isMuted();
    Sound.setMuted(m);
    toggle.textContent = m ? "🔇 Muted" : "🔊 Sound";
  });
  toggle.addEventListener("pointercancel", () => { down = false; });
  toggle.addEventListener("pointerleave", () => { down = false; });
})();

// ===================== Frame loop =====================
(function () {
  let last = null;
  function frame(now) {
    if (last !== null && !BZ.manual) BZ.tick(now - last);
    BZ.input.pump();
    last = now;
    BZ.view.render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
